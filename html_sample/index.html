<input type="text" id="search" placeholder="Search student...">

<ul id="students">
    <li>Trixie Lapana</li>
    <li>Jhules Migg Baquiran</li>
    <li>David Andronico Tudtud</li>
</ul>

<script>
document.getElementById("search").addEventListener("input", function() {
    let search = this.value.toLowerCase();
    let students = document.querySelectorAll("#students li");

    students.forEach(function(student) {
        student.style.display =
            student.textContent.toLowerCase().includes(search)
            ? "block"
            : "none";
    });
});
</script>
